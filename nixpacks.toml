# Build plan for Railway (Nixpacks).
#
# WHY THIS FILE EXISTS
# --------------------
# This repo needs BOTH toolchains:
#   - Python  runs the app (uvicorn) and the migrations (alembic)
#   - Node    builds the React SPA that Python then serves from apps/web/dist
#
# Nixpacks auto-detects ONE provider from the files it finds. With package.json
# and requirements.txt both present it picked Node, skipped Python, and `uvicorn`
# did not exist at start-up — the deploy answered 502 "Application failed to
# respond". Verified with `nixpacks plan` on that exact commit: setup installed
# nodejs_24 + pnpm and nothing else.
#
# `providers` does NOT merge several providers — nixpacks 1.41 honours only the
# FIRST entry. `providers = ["python", "node"]` yields a Python-only setup with
# no pnpm at all, so a pnpm build command would fail. That is why Node is added
# to the setup phase by hand below instead.
providers = ["python"]

# "..." keeps the Python provider's own packages (python311, postgresql_16.dev,
# gcc) and appends Node. Dropping the "..." would remove Python and reintroduce
# the 502.
#
# These names must exist in the nixpkgs archive THIS provider pins
# (bc8f8d1be…), which is NOT the archive the Node provider pins. Writing
# `pnpm-9_x` here — the name nixpacks' own Node provider uses — failed the build
# with `error: undefined variable 'pnpm-9_x'`, because that name exists only in
# the Node provider's archive. Here the attribute is `pnpm_9`, and `nodejs_24`
# does not exist at all (this archive goes up to nodejs_22).
#
# `nixpacks plan` does NOT catch this — it emits package names without resolving
# them. Run scripts/verify-nixpacks-pkgs.py after editing this list.
[phases.setup]
nixPkgs = ["...", "nodejs_22", "pnpm_9"]

# The Python provider owns the install phase (pip install -r requirements.txt),
# so the Node dependency install has to live here, after it.
# Only apps/web is built: the root `build` script would also compile apps/api,
# which is not deployed yet.
[phases.build]
dependsOn = ["install"]
cmds = [
  "pnpm install --frozen-lockfile",
  "pnpm --filter @kol/web build",
  # Fail the BUILD if the SPA is missing, rather than deploying a server with
  # nothing to serve. app/main.py falls back to frontend/ and logs loudly, but a
  # silent fallback hides the real problem.
  "test -f apps/web/dist/index.html || (echo 'BUILD FAILED: apps/web/dist/index.html missing' && exit 1)",
]

# NOTE: the start command is NOT defined here. railway.json owns it (and would
# override anything set here anyway), so it lives in exactly one place:
#   alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
# Migrations run at DEPLOY time — during build there is no database yet.
